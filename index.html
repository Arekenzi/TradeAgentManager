/* txt — короткая метка для шапки, full — расшифровка на экране связи */
function syncState(){
  if(NEWVER) return {k:'wait',txt:'обновить',full:'Вышла версия '+NEWVER+'. Нажмите, чтобы обновить приложение.'};
  if(!DB.sync.url) return {k:'off',txt:'без базы',full:'Общая база не подключена.'};
  if(!DB.auth.token) return {k:'wait',txt:'локально',full:'Открыт локальный режим. Нажмите, чтобы подключиться к общей базе.'};
  if(FLUSHING||SYNCING) return {k:'wait',txt:'обмен',full:'Идёт защищённая синхронизация с CRM.'};
  if(pending()) return {k:'wait',txt:'↑ '+pending(),full:'Ожидают отправки: '+pending()+'. Они уйдут автоматически.'};
  if(DB.sync.err){
    const recent=DB.sync.at&&Date.now()-DB.sync.at<20000;
    return {k:recent?'wait':'err',txt:recent?'переподключение':'связь',full:'CRM временно недоступна: '+DB.sync.err+'. Приложение переподключается автоматически.'};
  }
  if(!DB.sync.at) return {k:'wait',txt:'подключение',full:'Устанавливаю связь с общей базой.'};
  return {k:'ok',txt:LIVE_PUSH?'LIVE':'онлайн',full:(LIVE_PUSH?'WebSocket LIVE активен. ':'CRM подключена. ')+
    'Последний обмен: '+new Date(DB.sync.at).toLocaleTimeString('ru-RU')};
}

function readSyncFromLink(){

  try{
    let s=m[1].replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';

    if(SYNC_OK.test(url)&&url!==DB.sync.url){
      DB.sync={url,at:0,err:'',code:''}; persist();
      setTimeout(()=>toast('Общая база подключена'),600);

function enterApp(){
  const login=$('#login'), app=$('#app');
  document.body.classList.add('authenticated');
  if(login){login.classList.add('hide');login.style.setProperty('display','none','important');login.setAttribute('aria-hidden','true');}
  if(app){app.classList.remove('hide');app.style.removeProperty('display');app.style.removeProperty('visibility');app.removeAttribute('aria-hidden');}
  $('#lPass').value=''; $('#lPass2').value='';
  recalcUsed(); go('home');
  /* Successful login must enter the workspace immediately. Network follow-up is non-blocking. */
  Promise.resolve().then(()=>syncNow()).catch(e=>{DB.sync.err=String(e&&e.message||e||'').slice(0,120);persist();paintSync();});
  firstHint();
}
async function doLogin(){
  const id=$('#lUser').value||'admin', pass=$('#lPass').value, btn=$('#lGo');
  OFFLINE_LOGIN_READY=null; $('#lOffline').classList.add('hide'); $('#lErr').textContent='';
  const normalLabel=()=>$('#lPass2').classList.contains('hide')?'Войти':'Сохранить и войти';
  let completed=false;
  const stopBusy=()=>{btn.disabled=false;btn.classList.remove('login-busy');btn.textContent=normalLabel();};
  const err=m=>{ $('#lErr').textContent=m; stopBusy(); };
  if(pass.length<4) return err('Минимум 4 знака');
  const setting=!$('#lPass2').classList.contains('hide');
  if(setting&&!/^\d{6}$/.test(pass)) return err('Новый код — 6 цифр');
  if(setting&&pass!==$('#lPass2').value) return err('Коды не совпадают');
  btn.disabled=true;btn.classList.add('login-busy');btn.textContent='Вхожу…';
  const watchdog=setTimeout(()=>{if(!completed){$('#lErr').textContent='Вход не завершился вовремя. Нажмите «Войти» ещё раз.';stopBusy()}},10000);
  try{
    if(UNIFIED_MODE){DB.sync.url=location.origin;DB.sync.err='';DB.sync.code='';persist()}
    else {const link=await recoverServer(true);if(!link.ok) throw Object.assign(new Error(link.error||'сервер CRM недоступен'),{code:link.code||'NETWORK'})}
    let r=await api('/login',{method:'POST',auth:false,retry:false,timeout:7000,body:{login:id,pass,bootstrapCode:BOOTSTRAP_CODE||undefined,dev:(navigator.userAgent||'').replace(/[();]/g,' ').slice(0,60)}});
    if(r.code==='BOOTSTRAP_REQUIRED'){
      const bc=prompt('Первый запуск. Введите ADMIN_BOOTSTRAP_CODE из Cloudflare.'); if(!bc) return err('Первичная настройка отменена');
      BOOTSTRAP_CODE=bc.trim();$('#lPass2').classList.remove('hide');$('#lsub').textContent='Первый запуск — придумайте код администратора из 6 цифр';$('#lPass').value='';$('#lPass2').value='';$('#lPass').placeholder='Новый код из 6 цифр';return err('Введите новый код и повторите его ниже');
    }
    if(r.code==='SET_PASSWORD'){
      if($('#lPass2').classList.contains('hide')){$('#lPass2').classList.remove('hide');$('#lsub').textContent='Первый вход — придумайте код из 6 цифр';$('#lPass').placeholder='Новый код из 6 цифр';return err('Придумайте код и повторите его ниже')}
      r=await api('/login',{method:'POST',auth:false,retry:false,timeout:7000,body:{login:id,newPass:pass,bootstrapCode:BOOTSTRAP_CODE||undefined,dev:(navigator.userAgent||'').replace(/[();]/g,' ').slice(0,60)}});
    }
    if(!r.ok||!r.token) return err(r.error||'Не удалось войти');
    DB.auth={token:r.token,exp:r.exp,uid:r.user.id};BOOTSTRAP_CODE='';BACKOFF=0;REV=-1;DB.queue.forEach(op=>{op.tries=0});DB.sync.err='';DB.sync.code='';DB.users[r.user.id]=Object.assign({},DB.users[r.user.id],r.user);delete DB.users[r.user.id].pass;ME=DB.users[r.user.id];persist();
    completed=true;clearTimeout(watchdog);stopBusy();enterApp();
    /* local offline credential is helpful, but must NEVER block a successful online login */
    rememberLocal(id,pass).catch(()=>{});
    if(r.user.mustChange||!/^\d{6}$/.test(pass)) setTimeout(()=>{
      const why=r.user.mustChange?'Временный код нужно заменить.':'Можно заменить прежний пароль на быстрый код.';
      if(confirm(why+' Установить новый код из 6 цифр сейчас?')){
        const np=prompt('Новый код из 6 цифр');
        if(np&&/^\d{6}$/.test(np)) api('/password',{method:'POST',body:{oldPass:pass,newPass:np}}).then(x=>{if(x.token){DB.auth.token=x.token;DB.auth.exp=x.exp;persist()}rememberLocal(id,np);DB.users[id].mustChange=false;persist();toast('Новый код установлен')}).catch(e=>toast('Не удалось: '+e.message));
        else if(np!==null) toast('Нужно ровно 6 цифр');
      }
    },900);
    return;
  }catch(e){
    if(e.status || !['NETWORK','TIMEOUT','OFF','BAD'].includes(e.code||'')) return err(e.message||'Сервер отклонил вход');
    if(e.code==='BAD') return err('Сервер ответил неправильно. Обновите страницу.');
    DB.sync.err=String(e.message||e).slice(0,120);persist();
    const okLocal=await checkLocal(id,pass);
    if(okLocal===true){OFFLINE_LOGIN_READY={id,pass};$('#lOffline').classList.remove('hide');return err('Сервер временно недоступен. Можно повторить вход или продолжить офлайн.')}
    if(okLocal===false) return err('Неверный код');
    return err(e.code==='TIMEOUT'?'Сервер отвечает слишком долго. Повторите вход.':'Не удалось связаться с сервером. Проверьте /ping.');
  }finally{
    if(!completed){clearTimeout(watchdog); if(btn.disabled) stopBusy();}
  }
}
/* Сессия кончилась или администратор сбросил код.

function relogin(msg){
  closeLiveSocket();
  DB.auth={token:'',exp:0,uid:''}; persist();
  ME=null; EDIT=null; PLAN=[];
  closeSheet(); closeDoc();
  document.body.classList.remove('authenticated');
  const app=$('#app'), login=$('#login');
  if(app){app.classList.add('hide');app.style.removeProperty('display');app.setAttribute('aria-hidden','true');}
  if(login){login.classList.remove('hide');login.style.removeProperty('display');login.removeAttribute('aria-hidden');}
  $('#lPass').value=''; $('#lPass2').value=''; $('#lPass2').classList.add('hide');
  paintLogin();
  $('#lErr').textContent=msg||'Сессия закончилась — войдите заново';
}
async function doLogout(){
  closeLiveSocket();
  try{ if(DB.auth.token) await api('/logout',{method:'POST'}); }catch(e){}
  DB.auth={token:'',exp:0,uid:''}; persist();
  location.reload();
}

function ta24PhotoCompress(file){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\//i.test(file.type||'')) return reject(new Error('Выберите изображение'));
    if(file.size>12*1024*1024) return reject(new Error('Файл слишком большой'));
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error('Не удалось прочитать файл'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>reject(new Error('Не удалось открыть изображение'));
      im.onload=()=>{
        try{
          /* Safe product-photo preparation.
             We only trim truly empty/light margins. We DO NOT aggressively detect the object,
             because that can crop a light/yellow/white bottle down to a cap or label. */
          const scanMax=1200;
          const k=Math.min(1,scanMax/Math.max(im.naturalWidth||1,im.naturalHeight||1));
          const sw=Math.max(1,Math.round(im.naturalWidth*k));
          const sh=Math.max(1,Math.round(im.naturalHeight*k));
          const scan=document.createElement('canvas'); scan.width=sw; scan.height=sh;
          const sx=scan.getContext('2d',{willReadFrequently:true});
          sx.fillStyle='#fff'; sx.fillRect(0,0,sw,sh); sx.drawImage(im,0,0,sw,sh);
          const data=sx.getImageData(0,0,sw,sh).data;
          const isBlank=(x,y)=>{
            const i=(y*sw+x)*4, r=data[i], g=data[i+1], b=data[i+2], a=data[i+3];
            return a<10 || (r>246&&g>246&&b>246&&Math.max(r,g,b)-Math.min(r,g,b)<10);
          };
          const rowBlank=(y)=>{let non=0; const step=Math.max(1,Math.floor(sw/350)); for(let x=0;x<sw;x+=step){if(!isBlank(x,y))non++} return non<=1};
          const colBlank=(x)=>{let non=0; const step=Math.max(1,Math.floor(sh/350)); for(let y=0;y<sh;y+=step){if(!isBlank(x,y))non++} return non<=1};
          let minX=0,minY=0,maxX=sw-1,maxY=sh-1;
          while(minY<maxY-8 && rowBlank(minY)) minY++;
          while(maxY>minY+8 && rowBlank(maxY)) maxY--;
          while(minX<maxX-8 && colBlank(minX)) minX++;
          while(maxX>minX+8 && colBlank(maxX)) maxX--;
          /* Never accept an absurd crop: keep the whole image if trimming became suspicious. */
          let cw=maxX-minX+1, ch=maxY-minY+1;
          if(cw<sw*.18 || ch<sh*.18 || cw*ch<sw*sh*.08){minX=0;minY=0;maxX=sw-1;maxY=sh-1;cw=sw;ch=sh}
          const pad=Math.max(8,Math.round(Math.max(cw,ch)*.05));
          minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
          maxX=Math.min(sw-1,maxX+pad); maxY=Math.min(sh-1,maxY+pad);
          cw=maxX-minX+1; ch=maxY-minY+1;

          /* Store a centered square asset. This guarantees predictable rendering in every card. */
          const side=420;
          const c=document.createElement('canvas'); c.width=side; c.height=side;
          const x=c.getContext('2d',{alpha:false});
          x.fillStyle='#fff'; x.fillRect(0,0,side,side);
          const inset=34;
          const scale=Math.min((side-inset*2)/cw,(side-inset*2)/ch);
          const dw=Math.max(1,Math.round(cw*scale)), dh=Math.max(1,Math.round(ch*scale));
          const dx=Math.round((side-dw)/2), dy=Math.round((side-dh)/2);
          x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high';
          x.drawImage(scan,minX,minY,cw,ch,dx,dy,dw,dh);
          let q=.84, out=c.toDataURL('image/jpeg',q);
          while(out.length>65000&&q>.38){q-=.07;out=c.toDataURL('image/jpeg',q)}
          if(out.length>80000) return reject(new Error('Фото не удалось достаточно уменьшить'));
          resolve(out);
        }catch(err){reject(new Error('Не удалось обработать фото'))}
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  if(!FB_READY||!FBAUTH||!FBAUTH.currentUser)return false;
  const q=Array.isArray(DB.queue)?DB.queue.splice(0):[];
  try{
    for(const op of q){
      if(!op)continue;
      if(op.type==='order.save'&&op.order)await FBDB.collection('orders').doc(fbSafeId(op.order.id)).set(fbClean(op.order));
      else if(op.type==='order.delete'&&isAdmin())await FBDB.collection('orders').doc(fbSafeId(op.id)).delete().catch(()=>{});
    }
    if(q.some(op=>op&&['order.save','order.delete'].includes(op.type))&&isAdmin())await fbPushAllUsage();
    persist();return true;
  }catch(e){DB.queue=q.concat(DB.queue||[]);persist();throw e}
};

async function legacyRequest(path,{method='GET',body,token,timeout=20000}={}){
  const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout),headers={'Content-Type':'application/json'};

    const r=await fetch(LEGACY_API.replace(/\/+$/,'')+path,{method,headers,body:body?JSON.stringify(body):undefined,cache:'no-store',signal:c.signal});
    const j=await r.json().catch(()=>null);
    if(!j)throw new Error('Старый сервер ответил не по формату');
    if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{code:j.code||'HTTP',status:r.status});

  }catch(e){if(e&&e.name==='AbortError')throw new Error('Старый сервер не ответил вовремя');throw e}
  finally{clearTimeout(timer)}

/* =====================================================================
   v25.3.5 — Android #app scroll host runtime bridge
   - tab/page navigation resets the Android app scroller to top;
   - sheets temporarily lock only the Android app scroller;
   - iOS and desktop behavior is untouched.
   ===================================================================== */
function ta2535AndroidAppScroll(){
  try{
    if(!document.documentElement.classList.contains('ta-android'))return null;
    return document.getElementById('app');
  }catch(_){return null}
}
try{
  const ta2535GoBase=go;
  go=function(v){
    const r=ta2535GoBase(v);
    const a=ta2535AndroidAppScroll();
    if(a){a.scrollTop=0;a.scrollLeft=0}
    return r;
  };
}catch(_){}
try{
  const ta2535SheetBase=sheet,ta2535CloseSheetBase=closeSheet;
  sheet=function(){
    const r=ta2535SheetBase.apply(this,arguments);
    const a=ta2535AndroidAppScroll();
    if(a)a.style.setProperty('overflow-y','hidden','important');
    return r;
  };
  closeSheet=function(){
    const r=ta2535CloseSheetBase.apply(this,arguments);
    const a=ta2535AndroidAppScroll();
    if(a)a.style.removeProperty('overflow-y');
    return r;
  };
}catch(_){}

</script>
</body>
</html>
