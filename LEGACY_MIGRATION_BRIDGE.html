<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeAgent — мост миграции</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071009;color:#eef4e9;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#0d1710;border:1px solid #2f4930;border-radius:22px;padding:24px;box-shadow:0 18px 60px #0008}h1{font-size:24px;margin:0 0 8px}.sub{color:#9ca99b;line-height:1.5;margin-bottom:20px}.warn{background:#332b0c;border:1px solid #6b5b19;color:#f4df78;padding:12px;border-radius:12px;margin-bottom:16px}.ok{background:#0d2a18;border-color:#245d35;color:#a9efb9}label{display:block;font-weight:700;margin:12px 0 7px}input{width:100%;height:50px;border:1px solid #365239;background:#071009;color:#fff;border-radius:13px;padding:0 15px;font-size:18px}button{width:100%;height:52px;border:0;border-radius:13px;background:#c9ef62;color:#0a1008;font-weight:800;font-size:16px;margin-top:16px}button:disabled{opacity:.5}.status{margin-top:16px;color:#aab6a9;white-space:pre-line;line-height:1.5}small{display:block;color:#768276;margin-top:18px;line-height:1.45}</style></head><body><div class="card"><h1>TradeAgent · перенос старой базы</h1><div class="sub">Этот файл только <b>читает</b> старую Cloudflare-базу и сохраняет ее в JSON. Ничего в старой базе он не удаляет и не изменяет.</div><div id="mode" class="warn"></div><label>Старый код администратора TradeAgent</label><input id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="6 цифр"><button id="go">Считать старую базу и сохранить JSON</button><div id="status" class="status"></div><small>После сохранения вернитесь в TradeAgent v25.0.2 → Админка → «Восстановление старой базы» → «Выбрать файл переноса».</small></div><script>
const API='https://tradeagent-manager-api.87058608077a.workers.dev';
const mode=document.getElementById('mode'),status=document.getElementById('status'),btn=document.getElementById('go');
const local=(location.protocol==='file:'||location.origin==='null');mode.textContent=local?'Режим локального файла — готово к чтению старой базы.':'ВАЖНО: сначала скачайте этот HTML и откройте его как локальный файл на Mac. Из GitHub Pages старый сервер блокирует запросы CORS.';if(local)mode.classList.add('ok');
async function req(path,{method='GET',body,token,timeout=45000}={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout),h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;try{const r=await fetch(API+path,{method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store',signal:c.signal});const j=await r.json().catch(()=>null);if(!j)throw new Error('Старый сервер ответил не по формату');if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}finally{clearTimeout(t)}}
function download(x){const blob=new Blob([JSON.stringify(x,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TradeAgent_legacy_migration_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
btn.onclick=async()=>{const code=document.getElementById('code').value.trim();if(code.length<4){status.textContent='Введите старый код администратора.';return}btn.disabled=true;status.textContent='Вхожу в старую базу…';try{const login=await req('/login',{method:'POST',body:{login:'admin',pass:code,dev:'Migration bridge v25.0.2'},timeout:12000});status.textContent='Читаю заявки, роли, остатки, настройки, фото и нумерацию…';const pull=await req('/pull?since=0',{token:login.token,timeout:60000});let audit={ok:false,log:[],warning:''};status.textContent='Читаю журнал действий…';try{audit=await req('/audit?limit=500',{token:login.token,timeout:45000})}catch(e){audit={ok:false,log:[],warning:String(e.message||e)}}const out={format:'tradeagent-legacy-migration/1',exportedAt:Date.now(),source:API,pull,audit};download(out);const photos=pull.photos&&pull.photos.map?Object.keys(pull.photos.map).length:0;status.textContent='ГОТОВО. Файл JSON сохранен.\nЗаявок: '+(pull.orders||[]).length+' · пользователей: '+(pull.users||[]).length+' · фото: '+photos+' · журнал: '+(audit.log||[]).length+(audit.warning?'\nПредупреждение журнала: '+audit.warning:'');}catch(e){const m=String(e.message||e);status.textContent='Не удалось: '+m+( /list\(\)|limit exceeded|перечислен|хранилище недоступно/i.test(m)?'\nДанные не удалены. Это лимит старого Cloudflare — повторите после сброса лимита.':'')}finally{btn.disabled=false}};
</script></body></html>
